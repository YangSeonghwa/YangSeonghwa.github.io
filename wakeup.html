<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주지운 일어나라 | Beflower 미니 인터랙티브</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("bf-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved ? saved : (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-bf-theme", theme);
      document.documentElement.classList.toggle("bf-theme-dark", theme === "dark");
      document.documentElement.classList.toggle("bf-theme-light", theme !== "dark");
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/css/beflower.css">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bf-bg);font-family:var(--bf-font-sans);color:var(--bf-ink);user-select:none}
.wakeup-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.wakeup-card{background:var(--bf-surface);border:1.5px solid var(--bf-line);border-radius:var(--bf-radius-xl);padding:28px 24px;box-shadow:var(--bf-shadow-md);display:flex;flex-direction:column;align-items:center;max-width:480px;width:100%;text-align:center}
h1{color:var(--bf-ink);margin:8px 0 12px;font-size:clamp(24px,5vw,32px)}
svg{width:min(84vw,360px);height:auto}
#head{cursor:pointer;transform-origin:130px 200px}
.wobble{animation:wob .35s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.clock{animation:shake .5s infinite;transform-origin:300px 190px}
.awake .clock{animation:none}
@keyframes shake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.zzz{animation:float 2s infinite ease-in-out}
.awake .zzz{display:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.awake #body{animation:jump .6s 2}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
#eyesOpen,#mouthOpen{display:none}
.awake #eyesOpen,.awake #mouthOpen{display:block}
.awake #eyesClosed,.awake #mouthClosed{display:none}
#msg{color:var(--bf-sub);font-weight:700;min-height:1.5em;margin:10px 0 14px}
#bar{width:220px;height:10px;background:var(--bf-surface-soft);border:1px solid var(--bf-line);border-radius:999px;overflow:hidden;margin-bottom:10px}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--bf-main),var(--bf-pink));transition:width .2s}
</style>
</head>
<body>
<nav class="bf-topbar" aria-label="전역 상단 네비게이션">
  <div class="bf-topbar-inner">
    <a class="bf-brand" href="index.html">
      <span class="bf-brand-logo" aria-hidden="true">🌸</span>
      <span class="bf-brand-text">
        <span class="bf-brand-title">Beflower의 과학 시뮬레이션 랩</span>
        <span class="bf-brand-sub">미니 인터랙티브 · 깨우기 체험</span>
      </span>
    </a>
    <div class="bf-topbar-actions">
      <div class="bf-nav">
        <a href="index.html">🏠 홈</a>
        <a href="index.html#sims">🧪 시뮬레이션</a>
        <a href="index.html#coding">💻 프로그램 수업</a>
        <a class="active" href="index.html#games">🎮 게임</a>
      </div>
      <button type="button" class="bf-theme-toggle" id="themeToggle" aria-label="다크 모드 전환" title="라이트/다크 테마 전환">
        <span class="bf-theme-icon" id="themeIcon" aria-hidden="true">🌙</span>
        <span class="bf-theme-label" id="themeLabel">다크</span>
      </button>
    </div>
  </div>
</nav>

<main class="wakeup-main">
  <div class="wakeup-card">
    <span class="bf-badge 게임">⏰ 미니 인터랙션</span>
    <h1>주지운 일어나라!</h1>
    <div id="bar"><div id="fill"></div></div>
    <svg id="scene" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="졸고 있는 귀여운 캐릭터와 알람시계">
      <rect x="20" y="170" width="220" height="90" rx="25" fill="#9ad0f5"/>
      <g id="body"><g id="head">
      <circle cx="130" cy="140" r="65" fill="#ffe0bd"/>
      <path d="M68 125 Q130 40 192 125 Q160 90 130 95 Q100 90 68 125Z" fill="#5b3a29"/>
      <g id="eyesClosed" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><path d="M105 140 Q115 148 125 140"/><path d="M140 140 Q150 148 160 140"/></g>
      <g id="eyesOpen"><circle cx="115" cy="140" r="8" fill="#333"/><circle cx="150" cy="140" r="8" fill="#333"/><circle cx="118" cy="137" r="3" fill="#fff"/><circle cx="153" cy="137" r="3" fill="#fff"/></g>
      <circle cx="100" cy="158" r="9" fill="#ffb3b3" opacity=".7"/>
      <circle cx="165" cy="158" r="9" fill="#ffb3b3" opacity=".7"/>
      <ellipse id="mouthClosed" cx="132" cy="172" rx="7" ry="5" fill="#d66"/>
      <path id="mouthOpen" d="M120 166 Q132 184 144 166Z" fill="#d66"/>
      </g></g>
      <g class="zzz" fill="#1f8a70" font-weight="bold"><text x="205" y="80" font-size="26">Z</text><text x="230" y="55" font-size="20">z</text><text x="250" y="35" font-size="15">z</text></g>
      <g class="clock">
      <circle cx="300" cy="190" r="45" fill="#ff7b7b"/>
      <circle cx="300" cy="190" r="33" fill="#fff"/>
      <path d="M300 190 L300 168 M300 190 L316 198" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <circle cx="270" cy="150" r="12" fill="#ffd24d"/><circle cx="330" cy="150" r="12" fill="#ffd24d"/>
      <path d="M285 240 L275 258 M315 240 L325 258" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      </g>
    </svg>
    <p id="msg">캐릭터를 톡톡 눌러 깨워 보세요! (0/5)</p>
    <button id="reset" class="bf-btn bf-btn-primary" type="button">다시 재우기</button>
  </div>
</main>

<footer class="bf-footer">
  <div class="bf-footer-inner">
    <div class="bf-footer-links">
      <a href="index.html">🏠 홈으로</a>
      <a href="index.html#sims">🧪 과학 시뮬레이션</a>
      <a href="index.html#coding">💻 프로그램 수업</a>
      <a href="index.html#games">🎮 게임 놀이터</a>
    </div>
    <div>© Beflower · AI와 함께 만드는 과학·프로그램 수업 연구실</div>
  </div>
</footer>

<script>
var NEED=5,taps=0,scene=document.getElementById('scene'),head=document.getElementById('head'),msg=document.getElementById('msg'),fill=document.getElementById('fill');
var lines=['음냐... 💤','으음... 조금만 더...','응? 누가 불러...','눈이 떠지려고 해...'];
head.addEventListener('click',function(){
 if(taps>=NEED)return;
 taps++;
 head.classList.remove('wobble');void head.getBoundingClientRect();head.classList.add('wobble');
 fill.style.width=(taps/NEED*100)+'%';
 if(taps<NEED){msg.textContent=lines[taps-1]+' ('+taps+'/'+NEED+')';}
 else{scene.classList.add('awake');msg.textContent='좋은 아침! 일어났어요 ☀️';}
});
document.getElementById('reset').addEventListener('click',function(){
 taps=0;scene.classList.remove('awake');fill.style.width='0';msg.textContent='캐릭터를 톡톡 눌러 깨워 보세요! (0/5)';
});
(function(){
  var btn=document.getElementById('themeToggle');
  function sync(){
    var dark=document.documentElement.getAttribute('data-bf-theme')==='dark';
    var ic=document.getElementById('themeIcon'),lb=document.getElementById('themeLabel');
    if(ic)ic.textContent=dark?'☀️':'🌙';
    if(lb)lb.textContent=dark?'라이트':'다크';
  }
  sync();
  if(btn)btn.addEventListener('click',function(){
    var next=document.documentElement.getAttribute('data-bf-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-bf-theme',next);
    document.documentElement.classList.toggle('bf-theme-dark',next==='dark');
    document.documentElement.classList.toggle('bf-theme-light',next!=='dark');
    try{localStorage.setItem('bf-theme',next);}catch(e){}
    sync();
  });
})();
</script>
</body>
</html>
