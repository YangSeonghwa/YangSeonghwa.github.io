<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7e8">
<title>수박 터뜨리기 | Beflower 게임 놀이터</title>
<style>
:root{--bg:#fff7e8;--ink:#26352d;--sub:#68756b;--green:#238653;--red:#e85d5d;--line:#f0e2c9;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 48px;background:radial-gradient(circle at 50% 0,#fff0c8 0,#fff8ec 48%,#e8f7e9 100%);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:700;margin:4px 0 18px}
header{text-align:center;margin-bottom:20px}
.eyebrow{display:inline-block;padding:5px 13px;border-radius:999px;background:#e4f4df;color:#267244;font-size:13px;font-weight:800}
h1{font-size:clamp(30px,6vw,46px);margin:10px 0 4px;letter-spacing:-1.5px}
header p{color:var(--sub);margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(16px,4vw,28px);box-shadow:0 12px 35px #76501b12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff9ef;border:1px solid var(--line);border-radius:15px;text-align:center;padding:10px 6px}
.stat span{display:block;color:var(--sub);font-size:12px;font-weight:700}
.stat strong{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums}
#time{color:var(--red)}#score{color:var(--green)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,18px);padding:clamp(10px,3vw,18px);border-radius:22px;background:linear-gradient(145deg,#d8f1c9,#b9e3a8);border:4px solid #a4d28e;box-shadow:inset 0 4px 12px #397d5620}
.target{position:relative;aspect-ratio:1;border:2px solid #b7dca7;border-radius:24px;background:linear-gradient(145deg,#fffdf4,#f4ffe9);cursor:pointer;touch-action:manipulation;overflow:hidden;display:grid;place-items:center;transition:transform .12s,border-color .12s}
.target:focus-visible{outline:4px solid #fff;outline-offset:2px}
.fruit{font-size:clamp(42px,10vw,76px);line-height:1;transform:scale(.68);opacity:.32;transition:transform .14s,opacity .14s;user-select:none;pointer-events:none;filter:drop-shadow(0 5px 3px #284b2530)}
.target.up .fruit{transform:scale(1);opacity:1;animation:bounce .45s ease-out}
.target.popped .fruit{transform:scale(1.35) rotate(20deg);opacity:0}
.target .burst{position:absolute;font-size:clamp(28px,7vw,48px);opacity:0;transform:scale(.3);pointer-events:none}
.target.popped .burst{animation:burst .42s ease-out}
@keyframes bounce{0%{transform:scale(.5)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.5)}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button.action{border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button.action:hover{transform:translateY(-2px);filter:brightness(1.03)}
#start{background:var(--green);color:#fff;box-shadow:0 5px 14px #23865340}
#reset{background:#fff0e5;color:#a84d36}
#start:focus-visible,#reset:focus-visible{outline:3px solid #26352d;outline-offset:3px}
.message{text-align:center;min-height:28px;margin:14px 0 0;color:var(--sub);font-weight:700}
.how{margin-top:18px;padding:15px 18px;border-radius:16px;background:#fff8e8;color:#68542a;font-size:14px;line-height:1.8}
.how b{color:#4c3b17}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
@media(max-width:420px){body{padding:16px 10px 32px}.stats{gap:6px}.stat{padding:8px 3px}.board{gap:8px;padding:8px}.target{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../index.html">← 메인으로 돌아가기</a>
  <header>
    <span class="eyebrow">🌸 BEFLOWER GAME PLAYGROUND</span>
    <h1>🍉 수박 터뜨리기!</h1>
    <p>30초 동안 나타나는 수박을 빠르게 눌러 터뜨려 보세요.</p>
  </header>
  <main class="panel">
    <div class="stats" aria-live="polite">
      <div class="stat"><span>점수</span><strong id="score">0</strong></div>
      <div class="stat"><span>남은 시간</span><strong id="time">30</strong></div>
      <div class="stat"><span>최고 기록</span><strong id="best">0</strong></div>
    </div>
    <div class="board" id="board" aria-label="수박 터뜨리기 게임판">
      <button class="target" type="button" aria-label="1번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="2번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="3번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="4번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="5번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="6번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="7번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="8번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
      <button class="target" type="button" aria-label="9번 수박 자리"><span class="fruit">🍉</span><span class="burst" aria-hidden="true">💥</span></button>
    </div>
    <div class="controls">
      <button class="action" id="start" type="button">게임 시작</button>
      <button class="action" id="reset" type="button">다시 하기</button>
    </div>
    <p class="message" id="message" role="status">게임 시작을 누르면 출발합니다!</p>
    <div class="how"><b>🎯 게임 방법</b><br>① 게임 시작을 누르세요.<br>② 나타나는 수박을 빠르게 눌러 터뜨리세요!<br>③ 30초 동안 최대한 많은 수박을 터뜨려 보세요!</div>
  </main>
  <footer>© <span id="year"></span> Beflower · 즐겁게 배우고 신나게 놀아요!</footer>
</div>
<script>
(() => {
  const targets = [...document.querySelectorAll(".target")];
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const messageEl = document.getElementById("message");
  const startBtn = document.getElementById("start");
  const resetBtn = document.getElementById("reset");
  let score = 0, time = 30, active = -1, running = false;
  let clock = null, popTimer = null, hideTimer = null;
  let best = 0;
  try { best = Number(localStorage.getItem("beflower-watermelon-best")) || 0; } catch (_) {}
  bestEl.textContent = best;
  document.getElementById("year").textContent = new Date().getFullYear();

  function clearTimers() {
    clearInterval(clock); clearTimeout(popTimer); clearTimeout(hideTimer);
    clock = popTimer = hideTimer = null;
  }
  function hideFruit() {
    targets.forEach(t => t.classList.remove("up", "popped"));
    active = -1;
  }
  function showFruit() {
    if (!running) return;
    hideFruit();
    active = Math.floor(Math.random() * targets.length);
    targets[active].classList.add("up");
    const visibleFor = Math.max(420, 1050 - (30 - time) * 14);
    hideTimer = setTimeout(() => {
      hideFruit();
      popTimer = setTimeout(showFruit, 160 + Math.random() * 240);
    }, visibleFor);
  }
  function finish() {
    running = false; clearTimers(); hideFruit(); time = 0; timeEl.textContent = time;
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem("beflower-watermelon-best", String(best)); } catch (_) {}
      messageEl.textContent = "🎉 최고 기록 달성! 수박 터뜨리기 챔피언이에요!";
    } else {
      messageEl.textContent = "게임 끝! 수박 " + score + "개를 터뜨렸어요. 다시 도전해 볼까요?";
    }
    startBtn.textContent = "다시 시작";
  }
  function startGame() {
    clearTimers(); hideFruit();
    score = 0; time = 30; running = true;
    scoreEl.textContent = score; timeEl.textContent = time;
    messageEl.textContent = "수박을 터뜨려라! 🍉";
    startBtn.textContent = "게임 진행 중";
    showFruit();
    clock = setInterval(() => {
      time -= 1; timeEl.textContent = time;
      if (time <= 0) finish();
    }, 1000);
  }
  targets.forEach((target, index) => target.addEventListener("click", () => {
    if (!running || index !== active) return;
    score += 1; scoreEl.textContent = score;
    target.classList.remove("up");
    target.classList.add("popped");
    clearTimeout(hideTimer); active = -1;
    popTimer = setTimeout(showFruit, 180);
  }));
  startBtn.addEventListener("click", startGame);
  resetBtn.addEventListener("click", () => {
    clearTimers(); running = false; hideFruit();
    score = 0; time = 30; scoreEl.textContent = score; timeEl.textContent = time;
    messageEl.textContent = "준비됐나요? 게임 시작을 눌러 보세요!";
    startBtn.textContent = "게임 시작";
  });
})();
</script>
</body>
</html>
