<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f9f6">
<title>두더지 잡기 | Beflower 게임 놀이터</title>
<style>
:root{--bg:#f4f9f6;--ink:#1d2a30;--sub:#5a6b72;--main:#1f8a70;--pink:#f08fb0;--line:#dcebe4;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 48px;background:radial-gradient(circle at 50% 0,#e3f5eb 0,#f4f9f6 48%,#eef4ff 100%);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--main);font-weight:700;margin:4px 0 18px}
header{text-align:center;margin-bottom:20px}
.eyebrow{display:inline-block;padding:5px 13px;border-radius:999px;background:#e1f2e9;color:#24745f;font-size:13px;font-weight:800}
h1{font-size:clamp(30px,6vw,46px);margin:10px 0 4px;letter-spacing:-1.5px}
header p{color:var(--sub);margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(16px,4vw,28px);box-shadow:0 12px 35px #204d3b12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#f4f9f6;border:1px solid var(--line);border-radius:15px;text-align:center;padding:10px 6px}
.stat span{display:block;color:var(--sub);font-size:12px;font-weight:700}
.stat strong{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums}
#time{color:#d45b83}#score{color:var(--main)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,18px);padding:clamp(10px,3vw,18px);border-radius:22px;background:linear-gradient(145deg,#c8ead6,#a9d8bd);border:4px solid #8dc4a5;box-shadow:inset 0 4px 12px #397d5630}
.hole{position:relative;aspect-ratio:1.12;border:0;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#573c32 0 44%,#765044 45% 57%,#9b6c54 58% 66%,transparent 67%);cursor:pointer;touch-action:manipulation;overflow:hidden;display:grid;place-items:center}
.hole:focus-visible{outline:4px solid #fff;outline-offset:2px}
.mole{position:absolute;bottom:16%;font-size:clamp(42px,10vw,76px);line-height:1;transform:translateY(115%) scale(.7);transition:transform .12s ease;filter:drop-shadow(0 5px 2px #291b1b55);user-select:none;pointer-events:none}
.hole.up .mole{transform:translateY(0) scale(1)}
.hole.hit .mole{transform:translateY(15%) scale(.65) rotate(18deg)}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button.action{border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button.action:hover{transform:translateY(-2px);filter:brightness(1.03)}
#start{background:var(--main);color:#fff;box-shadow:0 5px 14px #1f8a7040}
#reset{background:#fce8ef;color:#a83f67}
#start:focus-visible,#reset:focus-visible{outline:3px solid #1d2a30;outline-offset:3px}
.message{text-align:center;min-height:28px;margin:14px 0 0;color:var(--sub);font-weight:700}
.how{margin-top:18px;padding:15px 18px;border-radius:16px;background:#fff8e8;color:#68542a;font-size:14px;line-height:1.8}
.how b{color:#4c3b17}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
@media(max-width:420px){body{padding:16px 10px 32px}.stats{gap:6px}.stat{padding:8px 3px}.board{gap:8px;padding:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../index.html">← 메인으로 돌아가기</a>
  <header>
    <span class="eyebrow">🌸 BEFLOWER GAME PLAYGROUND</span>
    <h1>🐹 두더지 잡기!</h1>
    <p>30초 동안 나타나는 두더지를 빠르게 잡아 보세요.</p>
  </header>
  <main class="panel">
    <div class="stats" aria-live="polite">
      <div class="stat"><span>점수</span><strong id="score">0</strong></div>
      <div class="stat"><span>남은 시간</span><strong id="time">30</strong></div>
      <div class="stat"><span>최고 기록</span><strong id="best">0</strong></div>
    </div>
    <div class="board" id="board" aria-label="두더지 게임판">
      <button class="hole" type="button" aria-label="첫 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="두 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="세 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="네 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="다섯 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="여섯 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="일곱 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="여덟 번째 구멍"><span class="mole">🐹</span></button>
      <button class="hole" type="button" aria-label="아홉 번째 구멍"><span class="mole">🐹</span></button>
    </div>
    <div class="controls">
      <button class="action" id="start" type="button">게임 시작</button>
      <button class="action" id="reset" type="button">다시 하기</button>
    </div>
    <p class="message" id="message" role="status">게임 시작을 누르면 출발합니다!</p>
    <div class="how"><b>🎯 게임 방법</b><br>① 게임 시작을 누르세요.<br>② 구멍에서 얼굴을 내민 두더지를 빠르게 누르세요.<br>③ 30초 동안 최대한 많은 점수를 얻어 보세요!</div>
  </main>
  <footer>© <span id="year"></span> Beflower · 즐겁게 배우고 신나게 놀아요!</footer>
</div>
<script>
(() => {
  const holes = [...document.querySelectorAll(".hole")];
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const messageEl = document.getElementById("message");
  const startBtn = document.getElementById("start");
  const resetBtn = document.getElementById("reset");
  let score = 0, time = 30, active = -1, running = false;
  let clock = null, popTimer = null, hideTimer = null;
  let best = 0;
  try { best = Number(localStorage.getItem("beflower-mole-best")) || 0; } catch (_) {}
  bestEl.textContent = best;
  document.getElementById("year").textContent = new Date().getFullYear();

  function clearTimers() {
    clearInterval(clock); clearTimeout(popTimer); clearTimeout(hideTimer);
    clock = popTimer = hideTimer = null;
  }
  function hideMole() {
    holes.forEach(h => h.classList.remove("up", "hit"));
    active = -1;
  }
  function showMole() {
    if (!running) return;
    hideMole();
    let next = Math.floor(Math.random() * holes.length);
    if (holes.length > 1 && next === active) next = (next + 1 + Math.floor(Math.random() * (holes.length - 1))) % holes.length;
    active = next;
    holes[active].classList.add("up");
    const visibleFor = Math.max(420, 950 - (30 - time) * 12);
    hideTimer = setTimeout(() => {
      hideMole();
      popTimer = setTimeout(showMole, 180 + Math.random() * 260);
    }, visibleFor);
  }
  function finish() {
    running = false; clearTimers(); hideMole(); time = 0; timeEl.textContent = time;
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem("beflower-mole-best", String(best)); } catch (_) {}
      messageEl.textContent = "🎉 최고 기록 달성! 정말 대단해요!";
    } else {
      messageEl.textContent = "게임 끝! " + score + "점을 얻었어요. 다시 도전해 볼까요?";
    }
    startBtn.textContent = "다시 시작";
  }
  function startGame() {
    clearTimers(); hideMole();
    score = 0; time = 30; running = true;
    scoreEl.textContent = score; timeEl.textContent = time;
    messageEl.textContent = "두더지를 잡아라!";
    startBtn.textContent = "게임 진행 중";
    showMole();
    clock = setInterval(() => {
      time -= 1; timeEl.textContent = time;
      if (time <= 0) finish();
    }, 1000);
  }
  holes.forEach((hole, index) => hole.addEventListener("click", () => {
    if (!running || index !== active) return;
    score += 1; scoreEl.textContent = score;
    hole.classList.add("hit");
    clearTimeout(hideTimer); hideMole();
    popTimer = setTimeout(showMole, 150);
  }));
  startBtn.addEventListener("click", startGame);
  resetBtn.addEventListener("click", () => {
    clearTimers(); running = false; hideMole();
    score = 0; time = 30; scoreEl.textContent = score; timeEl.textContent = time;
    messageEl.textContent = "준비됐나요? 게임 시작을 눌러 보세요!";
    startBtn.textContent = "게임 시작";
  });
})();
</script>
</body>
</html>
